<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Page de test pour apprendre à publier un site sur Cloudflare.">
  <title>Mon premier site — Test Cloudflare</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 10%, #20365a 0, transparent 42%), #101827; color: #f7f9ff; }
    main { width: min(100%, 660px); padding: clamp(28px, 6vw, 54px); border: 1px solid #3d4b62; border-radius: 24px; background: #182439; box-shadow: 0 20px 60px #0005; }
    .eyebrow { display: inline-block; color: #9be6ce; font-size: .8rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 18px 0; font-size: clamp(2.2rem, 6vw, 3.6rem); line-height: 1.1; letter-spacing: -.04em; }
    p { color: #c7d1e1; font-size: 1.08rem; line-height: 1.7; }
    .status { display: flex; align-items: center; gap: 10px; margin: 28px 0; padding: 14px 18px; border-radius: 12px; background: #153d35; color: #b9f6dc; font-weight: 650; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #5af2b3; }
    button { cursor: pointer; border: 0; border-radius: 12px; padding: 13px 20px; font: inherit; font-weight: 700; background: #9be6ce; color: #10261f; }
    button:hover { background: #c4f8e7; }
    #message { min-height: 1.5em; margin-top: 14px; font-size: .95rem; }
    footer { margin-top: 28px; color: #98a9bf; font-size: .85rem; }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Projet 5 sites · Étape 2</span>
    <h1>Mon premier site est prêt.</h1>
    <p>Cette page sert à apprendre à publier un site gratuitement. Elle ne contient aucune information personnelle.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span>Page de test prête à être publiée</div>
    <button type="button" id="test-button">Tester le bouton</button>
    <p id="message" role="status" aria-live="polite"></p>
    <footer>Créé pour tester une première mise en ligne sur Cloudflare.</footer>
  </main>
  <script>
    document.getElementById('test-button').addEventListener('click', function () {
      document.getElementById('message').textContent = 'Le bouton fonctionne ! Prochaine étape : publier cette page.';
    });
  </script>
</body>
</html>
